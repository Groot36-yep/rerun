    <path id="rule" d="M12 57 H150"/>
    <path id="spark" d="M178 6 V22 M170 14 H186 M173 9 L183 19 M183 9 L173 19"/>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
