<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 66" role="img" aria-label="Rerun">
  <defs>
    <filter id="glow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Monoline letters, drawn the way neon tubing is bent. -->
    <path id="word" d="
      M12 47 V11 H27 A9 9 0 0 1 27 29 H12 M23 29 L35 47
      M65 11 H45 V47 H65 M45 29 H60
      M76 47 V11 H91 A9 9 0 0 1 91 29 H76 M87 29 L99 47
