    <use href="#word" stroke="#ffe2d6" stroke-width="1.5"/>
    <use href="#rule" stroke="#2fd2bf" stroke-width="3" filter="url(#glow)"/>
    <use href="#rule" stroke="#d8fff8" stroke-width="1.1"/>
    <use href="#spark" stroke="#2fd2bf" stroke-width="2.2" filter="url(#glow)"/>
